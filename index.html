<div id="sheetOverlay" class="sheet-backdrop" role="dialog" aria-modal="true" aria-label="ゲームのしくみ"><div class="sheet"><h2>光がふえる仕組み</h2><p><span class="color teal"></span> 水色の玉は、<b>金色の並びをコピーする場所</b>。水色の玉を1つ置くたびに、金色と同じ並びが1組生まれる。</p><div class="ex"><b>ためしてみよう</b><div style="display:flex;justify-content:space-evenly;margin:12px 0"><span style="color:#119e9f">●</span><span style="color:#d5a15b">●　●　●</span><span style="color:#638f87">→</span><span style="color:#15a79a">●　●　●</span></div>水色を右へ動かすと、そのコピーも丸ごと右へ動く。<br>金色を動かすと、<b>すべてのコピーの同じ位置</b>が動く。</div><p>上の「かさねた光」は、全部のコピーを1列にまとめたもの。2個が同じ場所に来たら<b>2個重なったまま</b>。見本も2個なら正解になる。</p><button id="closeSheet" class="close">ゲームに戻る</button></div></div>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',N=12,START=30,STEP=27.2,Y={out:119,a:427,b:520};
const stages=[
 {title:'ひとつのコピー',hint:'水色を動かすと、上の3つがついてくる',a:[2],b:[0,1,3],ga:[4],gb:[0,1,3],am:[0],bm:[]},
 {title:'そろって動く',hint:'水色1つで、金色の並びを丸ごと動かす',a:[1],b:[0,2,4],ga:[3],gb:[0,2,4],am:[0],bm:[]},
 {title:'コピーがふたつ',hint:'水色が2つ。上にも同じ模様が2組',a:[0,6],b:[0,2,4],ga:[0,1],gb:[0,2,4],am:[1],bm:[]},
 {title:'すきまを埋める',hint:'2組の光を、すきまなく並べよう',a:[0,3],b:[0,2,4],ga:[0,1],gb:[0,2,4],am:[1],bm:[]},
 {title:'光の帯',hint:'同じ3つの並びから、6つの光を作ろう',a:[0,5],b:[0,1,2],ga:[0,3],gb:[0,1,2],am:[1],bm:[]},
 {title:'ずらしてみる',hint:'水色を動かすと、まとまりごと移動する',a:[0,2],b:[0,3],ga:[0,1],gb:[0,3],am:[1],bm:[]},
 {title:'型を変える',hint:'今度は、金色の玉を動かしてみよう',a:[0,3],b:[0,4],ga:[0,3],gb:[0,1],am:[],bm:[1]},
 {title:'ふたつの手がかり',hint:'水色も金色も動かせる',a:[0,4],b:[0,3],ga:[0,2],gb:[0,1],am:[1],bm:[1]},
 {title:'ふたつが重なる',hint:'同じ場所に来た光は、2個重なる',a:[0,3],b:[0,2,4],ga:[0,2],gb:[0,2,4],am:[1],bm:[]},
 {title:'重なりをつくる',hint:'見本の二重の輪には、光が2つ必要',a:[0,3],b:[0,1,2],ga:[0,1],gb:[0,1,2],am:[1],bm:[]},
 {title:'3つのコピー',hint:'ひとつ動くたび、金色の並びがついてくる',a:[0,4,7],b:[0,1],ga:[0,2,5],gb:[0,1],am:[1,2],bm:[]},
 {title:'光を編む',hint:'2色を動かして、最後の模様を完成させる',a:[0,3],b:[0,1,4],ga:[0,2],gb:[0,1,3],am:[1],bm:[1,2]}
];
const $=id=>document.getElementById(id),svg=$('field'),panel=$('panel');let level=0,state=null,goal=[],drag=null,won=false,showLayers=true,frames=null,shapes={a:[],b:[]},audio=null,sound=true,lastTick=0,focus=null,completeMemory=0;
try{sound=localStorage.getItem('echo3_sound')!=='0';level=Math.max(0,Math.min(stages.length-1,Number(localStorage.getItem('echo3_level'))||0))}catch(_){}
const x=v=>START+STEP*v;
function el(name,props={},parent){const e=document.createElementNS(NS,name);for(let k in props)e.setAttribute(k,props[k]);if(parent)parent.append(e);return e}
function wipe(node){node.replaceChildren()}
function count(a,b){const arr=Array(N).fill(0);for(const av of a)for(const bv of b){const v=av+bv;if(Number.isInteger(v)&&v>=0&&v<N)arr[v]++}return arr}
function outOf(s){return count(s.ga,s.gb)}
function note(hz,vol=.02,length=.07,delay=0){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();if(audio.state==='suspended')audio.resume();const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(hz,t);o.frequency.exponentialRampToValueAtTime(hz*.88,t+length);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+length);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+length+.01)}catch(_){}}
function tick(){let t=performance.now();if(t-lastTick>40){lastTick=t;note(950,.011,.044)}}function dock(){note(740,.019,.082)}function success(){note(523.25,.026,.32);note(659.26,.017,.3,.075);note(783.99,.012,.32,.15)}
function renderProgress(){let p=$('progress');wipe(p);for(let i=0;i<stages.length;i++){let q=document.createElement('span');if(i===level)q.className='current';else if(i<level)q.className='past';p.append(q)}}
function rails(){for(const lane of ['a','b']){const g=$('rail'+lane.toUpperCase());wipe(g);const y=Y[lane];el('line',{x1:x(0),y1:y,x2:x(N-1),y2:y,class:'track'},g);for(let i=0;i<N;i++)el('circle',{cx:x(i),cy:y,r:2.3,class:'grid-dot'},g)}}
function target(){let g=$('targetGroup');wipe(g);let gg=$('resultGuide');wipe(gg);for(let i=0;i<N;i++)el('circle',{cx:x(i),cy:Y.out,r:2.3,fill:'#dfebe5'},gg);for(let i=0;i<N;i++){if(!goal[i])continue;el('circle',{cx:x(i),cy:Y.out,r:goal[i]>1?14.4:12.8,class:'target'+(goal[i]>1?' duo':'')},g);if(goal[i]>1){el('circle',{cx:x(i)+4.3,cy:Y.out-4.3,r:11.3,stroke:'#d9b27b','stroke-width':1.55,fill:'none'},g);el('text',{x:x(i),y:Y.out+3.8,'text-anchor':'middle','font-size':10,fill:'#ba9464','font-weight':750},g).textContent=goal[i]}}}
function pieces(){for(const lane of ['a','b']){let g=$('pieces'+lane.toUpperCase());wipe(g);shapes[lane]=[];let values=state[lane],move=stages[level][lane==='a'?'am':'bm'];values.forEach((v,i)=>{let root=el('g',{},g);let ring=el('circle',{cx:x(v),cy:Y[lane],r:20,fill:lane==='a'?'#b2ece0':'#f6dcb2',opacity:move.includes(i)?'.55':'.17'},root);let outer=el('circle',{cx:x(v),cy:Y[lane],r:move.includes(i)?15:12.4,fill:lane==='a'?'#e2faf4':'#fff5e7',opacity:move.includes(i)?'.95':'.6'},root);let main=el('circle',{cx:x(v),cy:Y[lane],r:move.includes(i)?11.6:9.2,fill:lane==='a'?'url(#cyanFill)':'url(#goldFill)',filter:lane==='b'?'url(#goldShadow)':'url(#softGlow)'},root);let dot=el('circle',{cx:x(v)-3,cy:Y[lane]-3,r:2.7,fill:'#fff',opacity:.75},root);shapes[lane].push({root,ring,outer,main,dot,move:move.includes(i)})})}}
function result(){let g=$('resultGroup');wipe(g);let counts=Array(N).fill(0);let coords=[];for(let i=0;i<state.a.length;i++)for(let j=0;j<state.b.length;j++){const pos=state.a[i]+state.b[j];coords.push({i,j,pos});if(Math.abs(Math.round(pos)-pos)<.02&&pos>=0&&pos<N)counts[Math.round(pos)]++}
 // Draw as true separate discs when multiples coincide, not a hue change.
 coords.sort((q,r)=>q.i-r.i||q.j-r.j);let drawn={};for(const c of coords){let key=Math.round(c.pos),same=Math.abs(c.pos-key)<.015?(drawn[key]||0):0;const quantity=counts[key]||1;let left=quantity>1?((same-(quantity-1)/2)*4.5):0;let top=quantity>1?((same-(quantity-1)/2)*-4.5):0;let active=!!focus&&((focus.lane==='a'&&focus.idx===c.i)||(focus.lane==='b'&&focus.idx===c.j));let opacity=focus&&!active?.28:1;
 el('circle',{cx:x(c.pos)+left,cy:Y.out+top,r:quantity>1?10.5:11.5,fill:active?'url(#cyanFill)':'url(#mintFill)',stroke:'#e7fff4','stroke-width':quantity>1?1.6:.75,opacity,class:'result-dot'},g);if(Math.abs(c.pos-key)<.015)drawn[key]=(drawn[key]||0)+1;}
 for(let i=0;i<N;i++)if(counts[i]>1){el('circle',{cx:x(i),cy:Y.out,r:7,fill:'#f9f4e8',opacity:'.91'},g);const e=el('text',{x:x(i),y:Y.out+3.3,'text-anchor':'middle','font-size':'10.1','font-weight':'800',fill:'#a9763d'},g);e.textContent=counts[i]}
}
function copies(){let g=$('copyRows');wipe(g);let shade=$('layerShade');shade.style.opacity=showLayers?'1':'0';shade.style.pointerEvents='none';if(!showLayers)return;const num=state.a.length;let ys=num===1?[293]:num===2?[269,319]:[253,290,327];state.a.forEach((v,i)=>{const y=ys[i];let chosen=focus?.lane==='a'?focus.idx===i:!focus;let opacity=focus?.lane==='a'&&!chosen?.35:1;el('rect',{x:19,y:y-16,width:321,height:32,rx:16,fill:chosen&&focus?'#edf9f5':'#fff',stroke:chosen&&focus?'#a5d8cc':'#e8efeb','stroke-width':'1',opacity},g);
 el('line',{x1:20,y1:y-10,x2:20,y2:y+10,stroke:'#58bfb0','stroke-width':2,opacity},g);
 for(let j=0;j<state.b.length;j++){let show=focus?.lane==='b'?focus.idx===j:!focus||focus?.lane==='a'&&focus.idx===i;let p=state.a[i]+state.b[j];el('circle',{cx:x(p),cy:y,r:7.2,fill:show?'#dba75f':'#ead5b6',stroke:'#fff','stroke-width':.8,opacity:show?opacity:.35},g)}
